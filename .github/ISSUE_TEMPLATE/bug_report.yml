name: Bug report
description: Report a reproducible problem in Mission Control
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a problem. Remove secrets and private workspace data before submitting.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start Mission Control with ...
        2. Press ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, terminal, Rust version, and provider
      placeholder: Ubuntu 24.04, Alacritty, rustc 1.x, Offline Demo
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized logs. Never include tokens or API keys.
      render: shell
  - type: checkboxes
    id: secrets
    attributes:
      label: Safety check
      options:
        - label: I removed API keys, tokens, and private workspace data.
          required: true
